# Update all the sections by editing the data.yml file inside _data folder.

# Site Settings

# SEO plugin
title: Giedrius Tuminauskas — Résumé
author: Giedrius Tuminauskas
tagline: Lead Platform Engineer # Short description for jekyll-seo-tag
description: Lead Platform Engineer with experience in DevOps, infrastructure automation, Linux systems, security, and technical leadership # Longer description for jekyll-seo-tag

url: "https://gtuminauskas.github.io"
baseurl: "/website-jekyll" # change it according to your repository name

#twitter:
#  username: stevedoe123
#  card: summary

social:
  links:
    - https://www.linkedin.com/in/gtuminauskas
    - https://github.com/gtuminauskas

google_site_verification: # Put your google verification tag here

# End SEO

# Style will be applied only after restarting the build or serve. Just choose one of the options.
theme_skin: red # gray blue turquoise green berry red

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style

# Build settings
compress-site: yes

encoding: "utf-8"
compress_html: # - http://jch.penibelst.de/
  clippings: all
  ignore:
    envs: development
